# One-time job: copies product photos and the logo from the old WordPress site into site/static/img.
# Run it from the Actions tab (Run workflow) while the WordPress site is still online.
name: Import WordPress images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -e
          U=https://vitalitychews.com/wp-content/uploads
          mkdir -p site/static/img/products
          dl() { curl -fsSL -A "Mozilla/5.0 (VitalityChews image import)" -o "$2" "$1" || echo "FAILED: $1"; }
          dl $U/2024/01/Logo.png site/static/img/logo.png
          dl $U/2024/01/icon.png site/static/img/icon.png
          dl $U/2024/01/products.png site/static/img/products-lineup.png
          dl $U/2024/01/Wallpaper.jpg site/static/img/og-default.jpg
          dl $U/2023/12/6537ROC929.png site/static/img/products/roc929.png
          dl $U/2023/12/ROC729-3.png site/static/img/products/roc929-label.png
          dl $U/2022/02/6537ROC942.png site/static/img/products/roc942.png
          dl $U/2020/08/ROC942.png site/static/img/products/roc942-label.png
          dl $U/2022/02/ROC942.3.10.jpg site/static/img/products/roc942-lifestyle.jpg
          dl $U/2020/08/6537ROC923.png site/static/img/products/roc923.png
          dl $U/2020/08/ROC923.png site/static/img/products/roc923-label.png
          dl $U/2020/08/ROC923.9.12.jpg site/static/img/products/roc923-lifestyle.jpg
          dl $U/2020/08/6537ROC920.png site/static/img/products/roc920.png
          dl $U/2020/08/ROC920.png site/static/img/products/roc920-label.png
          dl $U/2020/08/6537ROC918.png site/static/img/products/roc918.png
          dl $U/2020/08/ROC918.png site/static/img/products/roc918-label.png
          dl $U/2020/08/ROC918.6.8.jpg site/static/img/products/roc918-lifestyle.jpg
          file site/static/img/*.* site/static/img/products/* || true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/static/img
          git diff --cached --quiet || git commit -m "Import product images from WordPress"
          git push
